<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Meeting Quota</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="terminal">
    <header><span>MEETING QUOTA</span><span id="clock">DAY 1 · 0:45</span></header>

    <div id="who">SUPERVISOR <span id="stars" class="alarm"></span></div>
    <div class="row">
      <span>STANDING <b id="standing">50</b></span>
      <span>FAVORS <b id="favors">2</b></span>
    </div>

    <div class="meter">
      <div class="lbl"><span>QUOTA</span><span id="quota-txt">0 / 0</span></div>
      <div class="bar"><div id="quota-fill"></div></div>
    </div>
    <div class="meter">
      <div class="lbl"><span>SUPPLY</span><span id="supply-txt">100000</span></div>
      <div class="bar"><div id="supply-fill"></div></div>
    </div>

    <div class="row">
      <span>EXPOSURE <b id="exposure">0%</b></span>
      <button id="reassigned-btn" class="link">REASSIGNED: <b id="reassigned">0</b></button>
    </div>

    <div id="modes">
      <button data-mode="ease">EASE</button>
      <button data-mode="hold">HOLD</button>
      <button data-mode="push">PUSH</button>
    </div>

    <div id="workers"></div>

    <div class="actions">
      <button id="bribe-btn">BRIBE CONTACT</button>
      <button id="inspect-btn">INVITE INSPECTOR</button>
    </div>

    <div id="log"></div>

    <footer>
      <button id="pause-btn">PAUSE</button>
      <button id="reset-btn">RESET</button>
    </footer>
  </div>

  <div id="cemetery" class="overlay" hidden>
    <div class="box">
      <div class="lbl"><span>REASSIGNED</span><button id="cem-close" class="link">[X]</button></div>
      <div id="stones"></div>
      <div id="epitaph">tap a stone</div>
    </div>
  </div>

  <div id="gameover" class="overlay" hidden>
    <div class="box">
      <div id="go-title" class="alarm">POSITION REVOKED</div>
      <div id="go-text"></div>
      <button id="go-restart">NEW POSTING</button>
    </div>
  </div>

  <script src="workers.js"></script>
  <script src="game.js"></script>
</body>
</html>
